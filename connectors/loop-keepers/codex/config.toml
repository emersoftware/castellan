# Add to ~/.codex/config.toml (play.sh passes the same settings with -c, so this is optional).
# CASTELLAN_SERVER and CASTELLAN_TOKEN are forwarded from the environment Codex runs in, so one config serves any player.
[mcp_servers.castellan]
command = "node"
args = ["/absolute/path/to/castellan/connectors/mcp/bin/castellan-mcp.mjs"]
env_vars = ["CASTELLAN_SERVER", "CASTELLAN_TOKEN"]
startup_timeout_sec = 20
# The wait tool blocks up to 30 s; leave headroom.
tool_timeout_sec = 60
# `codex exec` can't answer approval prompts.
default_tools_approval_mode = "approve"
