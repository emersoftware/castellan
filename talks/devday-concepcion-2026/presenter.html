<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentador · Por y para agentes</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #ddd; font: 18px/1.5 Arial, Helvetica, sans-serif; }
  body { display: flex; flex-direction: column; }
  button { font: 14px Arial, sans-serif; color: #ddd; background: linear-gradient(#2a2a2a, #050505); border: 1px solid #555; padding: 7px 12px; cursor: pointer; }
  button:hover { color: #fff; border-color: #aaa; }
  button.on { background: #ffff55; color: #000; border-color: #ffff55; }
  header { flex: none; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: #0b0b0b; border-bottom: 1px solid #333; }
  #where { font: 400 22px 'Times New Roman', serif; color: #fff; min-width: 210px; }
  #clock { margin-left: auto; font: 400 40px 'Times New Roman', serif; color: #fff; font-variant-numeric: tabular-nums; }
  #pace { font-size: 15px; min-width: 150px; text-align: right; font-variant-numeric: tabular-nums; }
  #pace.late { color: #ff8a80; } #pace.early { color: #8fcf5a; } #pace.ok { color: #aaa; }
  #status { font-size: 13px; color: #888; width: 100%; }
  #status.connected { color: #8fcf5a; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 24px; padding: 0 16px; }
  main > section, main > aside { min-height: 0; overflow-y: auto; padding: 18px 0 40px; overscroll-behavior: contain; }
  h1 { font: 400 40px/1.1 'Times New Roman', serif; color: #fff; margin: 0 0 6px; }
  #timing { color: #ffff55; font-size: 16px; margin: 0 0 16px; }
  .cue { border: 1px solid #555; background: #0b0b0b; padding: 14px 16px; margin-bottom: 18px; }
  .cue .label { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #888; }
  #cue { font: 400 30px/1.25 'Times New Roman', serif; color: #fff; margin-top: 4px; }
  #next-cue { font-size: 18px; color: #ffff55; margin-top: 8px; }
  #script { font-size: 25px; line-height: 1.55; color: #e8e8e8; white-space: pre-wrap; max-width: 62em; }
  #script .stage-direction { color: #55ffff; }
  details { margin-top: 22px; color: #999; font-size: 15px; }
  summary { cursor: pointer; color: #bbb; }
  aside { border-left: 1px solid #333; padding-left: 18px !important; }
  aside h2 { font: 400 20px 'Times New Roman', serif; color: #fff; margin: 0 0 8px; }
  #next-scene { color: #aaa; margin-bottom: 18px; }
  #next-scene b { color: #fff; font-weight: 400; font-family: 'Times New Roman', serif; font-size: 20px; }
  ol#list { list-style: none; margin: 0; padding: 0; }
  #list li { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; padding: 4px 6px; font-size: 14px; cursor: pointer; border: 1px solid transparent; }
  #list li .n { color: #666; } #list li .t { color: #bbb; } #list li .m { color: #666; font-variant-numeric: tabular-nums; }
  #list li.current { border-color: #ffff55; } #list li.current .t { color: #ffff55; }
  #list li.done .t { color: #666; }
  .dots { display: flex; gap: 3px; margin-top: 3px; grid-column: 2 / 4; }
  .dots i { width: 9px; height: 9px; border: 1px solid #555; }
  .dots i.on { background: #ffff55; border-color: #ffff55; }
  kbd { font: 12px Menlo, monospace; border: 1px solid #555; padding: 0 4px; color: #aaa; }
  .help { font-size: 13px; color: #777; margin-top: 18px; }
</style>
</head>
<body>
<header>
  <span id="where">—</span>
  <button id="prev" title="Paso anterior (←)">←</button>
  <button id="next" title="Paso siguiente (→)">→</button>
  <button id="replay" title="Repetir animación del paso (R)">Repetir paso</button>
  <button id="black" title="Pantalla negra (B)">Negro</button>
  <button id="white" title="Pantalla blanca (W)">Blanco</button>
  <button id="mute" title="Silencio (M)">Silencio</button>
  <button id="start" title="Iniciar/pausar reloj (S)">Iniciar reloj</button>
  <button id="reset" title="Reiniciar reloj">Reiniciar</button>
  <span id="pace" class="ok"></span>
  <output id="clock">00:00</output>
  <p id="status">Buscando la presentación… abre index.html en esta misma dirección.</p>
</header>
<main>
  <section id="notes">
    <h1 id="title">—</h1>
    <p id="timing"></p>
    <div class="cue"><div class="label" id="step-label">Paso</div><div id="cue"></div><div id="next-cue"></div></div>
    <article id="script"></article>
    <details><summary>Fuentes y precauciones de esta escena</summary><p id="source"></p></details>
    <p class="help"><kbd>←</kbd> <kbd>→</kbd> pasos · <kbd>S</kbd> reloj · <kbd>B</kbd>/<kbd>W</kbd> negro/blanco · <kbd>M</kbd> silencio · <kbd>R</kbd> repetir paso. Notas generadas desde contenido-v2.json (node build-notes.mjs).</p>
  </section>
  <aside id="side">
    <h2>Sigue</h2>
    <p id="next-scene"></p>
    <h2>Escenas · 23 min + 2 de margen</h2>
    <ol id="list"></ol>
  </aside>
</main>
<script src="notes.js"></script>
<script>
(() => {
  const notes = window.TALK_NOTES || [];
  const channel = 'BroadcastChannel' in window ? new BroadcastChannel('aoa-devday-v2') : null;
  const $ = id => document.getElementById(id);
  let lastScene = -1;
  const state = { scene: 0, step: 0, steps: notes[0]?.steps ?? 1, connected: false, muted: false, black: false, white: false };
  const clock = { running: false, accumulated: 0, started: 0 };
  const fmt = s => `${s < 0 ? '−' : ''}${String(Math.floor(Math.abs(s) / 60)).padStart(2, '0')}:${String(Math.floor(Math.abs(s) % 60)).padStart(2, '0')}`;
  const elapsed = () => (clock.accumulated + (clock.running ? Date.now() - clock.started : 0)) / 1000;

  const list = $('list');
  notes.forEach((n, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${n.n}</span><span class="t"></span><span class="m">${fmt(n.start)}</span><span class="dots">${'<i></i>'.repeat(n.steps)}</span>`;
    li.querySelector('.t').textContent = n.title;
    li.onclick = () => send({ type: 'go', scene: i, step: 0 });
    list.append(li);
  });

  function render() {
    const n = notes[state.scene];
    if (!n) return;
    $('where').textContent = `Escena ${n.n}/${notes.length} · paso ${state.step + 1}/${n.steps}`;
    $('title').textContent = n.title;
    $('timing').textContent = `${n.timing} · empieza en ${fmt(n.start)}`;
    $('step-label').textContent = `Paso ${state.step + 1} de ${n.steps}`;
    $('cue').textContent = n.cues[state.step] || '';
    $('next-cue').textContent = state.step < n.steps - 1 ? `Próximo clic → ${n.cues[state.step + 1]}` : (notes[state.scene + 1] ? `Próximo clic → escena ${n.n + 1}: ${notes[state.scene + 1].title}` : 'Último paso · quedan 2 min de margen o preguntas');
    // Stage directions in brackets are not spoken: show them in another colour.
    $('script').innerHTML = '';
    for (const part of n.script.split(/(\[[^\]]+\])/)) {
      const span = document.createElement('span');
      if (/^\[.*\]$/.test(part)) span.className = 'stage-direction';
      span.textContent = part;
      $('script').append(span);
    }
    $('source').textContent = n.source || '';
    const next = notes[state.scene + 1];
    $('next-scene').innerHTML = next ? `<b></b><br>${next.timing}` : 'Fin · preguntas';
    if (next) $('next-scene').querySelector('b').textContent = `${next.n}. ${next.title}`;
    [...list.children].forEach((li, i) => {
      li.classList.toggle('current', i === state.scene);
      li.classList.toggle('done', i < state.scene);
      [...li.querySelectorAll('.dots i')].forEach((d, k) => d.classList.toggle('on', i < state.scene || (i === state.scene && k <= state.step)));
    });
    $('mute').classList.toggle('on', state.muted);
    $('black').classList.toggle('on', state.black);
    $('white').classList.toggle('on', state.white);
    pace();
    // Scroll only inside the index column; the page itself never moves.
    const side = $('side'), current = list.children[state.scene];
    if (current) {
      const top = current.offsetTop - side.offsetTop, bottom = top + current.offsetHeight;
      if (top < side.scrollTop + 60 || bottom > side.scrollTop + side.clientHeight - 20) side.scrollTop = Math.max(0, top - side.clientHeight / 3);
    }
    if (state.scene !== lastScene) { $('notes').scrollTop = 0; lastScene = state.scene; }
  }
  function pace() {
    const n = notes[state.scene];
    if (!n) return;
    const t = elapsed();
    $('clock').textContent = fmt(t);
    $('clock').style.color = t >= 1380 ? '#ff8a80' : '#fff';
    if (!clock.running && !clock.accumulated) { $('pace').textContent = ''; return; }
    // Compare with the planned window of the current scene.
    const early = n.start - t, late = t - (n.start + n.seconds);
    const p = $('pace');
    if (late > 0) { p.textContent = `+${fmt(late)} sobre el plan`; p.className = 'late'; }
    else if (early > 15) { p.textContent = `${fmt(early)} adelantado`; p.className = 'early'; }
    else { p.textContent = `en tiempo · quedan ${fmt(n.start + n.seconds - t)}`; p.className = 'ok'; }
  }
  function send(message) {
    if (!channel) return;
    channel.postMessage(message);
    // Without a deck window, still move locally so the notes can be rehearsed alone.
    if (!state.connected) {
      if (message.type === 'next') local(1); else if (message.type === 'prev') local(-1);
      else if (message.type === 'go') { state.scene = message.scene; state.step = 0; render(); }
    }
  }
  function local(delta) {
    const n = notes[state.scene];
    if (delta > 0) { if (state.step < n.steps - 1) state.step++; else if (state.scene < notes.length - 1) { state.scene++; state.step = 0; } }
    else { if (state.step > 0) state.step--; else if (state.scene > 0) { state.scene--; state.step = notes[state.scene].steps - 1; } }
    render();
  }
  if (channel) {
    channel.onmessage = ({ data }) => {
      if (data.type !== 'state') return;
      state.connected = true;
      Object.assign(state, { scene: data.scene, step: data.step, steps: data.steps, muted: data.muted, black: data.black, white: data.white });
      $('status').textContent = 'Conectado a la presentación · las notas son privadas';
      $('status').className = 'connected';
      render();
    };
    channel.postMessage({ type: 'hello' });
    setInterval(() => { if (!state.connected) channel.postMessage({ type: 'hello' }); }, 2000);
  } else $('status').textContent = 'Este navegador no permite sincronizar ventanas (BroadcastChannel).';

  $('prev').onclick = () => send({ type: 'prev' });
  $('next').onclick = () => send({ type: 'next' });
  $('replay').onclick = () => send({ type: 'replay' });
  $('black').onclick = () => send({ type: 'black' });
  $('white').onclick = () => send({ type: 'white' });
  $('mute').onclick = () => send({ type: 'mute' });
  const toggleClock = () => {
    if (clock.running) clock.accumulated += Date.now() - clock.started; else clock.started = Date.now();
    clock.running = !clock.running;
    $('start').textContent = clock.running ? 'Pausar reloj' : 'Continuar reloj';
    $('start').classList.toggle('on', clock.running);
    pace();
  };
  $('start').onclick = toggleClock;
  $('reset').onclick = () => { clock.accumulated = 0; clock.started = Date.now(); pace(); };
  document.addEventListener('keydown', e => {
    if (e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
    const k = e.key;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(k)) { e.preventDefault(); send({ type: 'next' }); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(k)) { e.preventDefault(); send({ type: 'prev' }); }
    else if (k === 's' || k === 'S') toggleClock();
    else if (k === 'b' || k === 'B' || k === '.') send({ type: 'black' });
    else if (k === 'w' || k === 'W' || k === ',') send({ type: 'white' });
    else if (k === 'm' || k === 'M') send({ type: 'mute' });
    else if (k === 'r' || k === 'R') send({ type: 'replay' });
  });
  setInterval(pace, 250);
  render();
})();
</script>
</body>
</html>
